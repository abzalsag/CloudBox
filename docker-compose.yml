services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: cloudbox
      POSTGRES_DB: cloudbox
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbox -d cloudbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweeddata:/data

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://cloudbox:cloudbox@postgres:5432/cloudbox?sslmode=disable", "up"]

  api:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cloudbox:cloudbox@postgres:5432/cloudbox?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: cloudbox
      S3_SECRET_KEY: cloudbox-secret
      S3_BUCKET: cloudbox
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
  seaweeddata: