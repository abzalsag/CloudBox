services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: cloudbox
      POSTGRES_DB: cloudbox
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master (UI)
    volumes:
      - seaweeddata:/data

volumes:
  pgdata:
  seaweeddata: